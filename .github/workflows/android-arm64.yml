name: Android ARM64 core

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  region-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test regions, HD Mode 7 and MSU-1 using synthetic ROMs
        shell: bash
        run: |
          mkdir -p build
          bash ci/test-region.sh 2>&1 | tee build/region-tests.log
      - name: Upload region regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: region-regression-${{ github.sha }}
          path: build/region-tests.log
          if-no-files-found: ignore
          retention-days: 30

  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK r28c
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build and validate Android ARM64 shared core
        run: bash scripts/build-android-arm64.sh
      - name: Upload compiled core and verification report
        uses: actions/upload-artifact@v4
        with:
          name: snes9x-ntsc-lie-pal-android-arm64-${{ github.sha }}
          path: |
            build/android-arm64/snes9x_libretro_android.so
            build/android-arm64/android-core-smoke
            build/android-arm64/SHA256SUMS
            build/android-arm64/elf-validation.json
            build/android-arm64/build-metadata.txt
            build/android-arm64/build-diagnostics.json
            build/android-arm64/build.log
            build/android-arm64/LICENSE
            build/android-arm64/snes_ntsc-license.txt
            build/android-arm64/NDK-NOTICE.txt
            build/android-arm64/NDK-NOTICE.toolchain.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-failed-build-${{ github.sha }}
          path: build/android-arm64/build.log
          if-no-files-found: ignore

  # Publishing a release attaches the Android core as a ZIP (see also
  # desktop-rocknix.yml, which fills an empty release text).
  release:
    needs: android-arm64
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snes9x-ntsc-lie-pal-android-arm64-${{ github.sha }}
          path: android-arm64
      - name: Zip and attach
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          rm -f android-arm64/android-core-smoke
          (cd android-arm64 && zip -r -X "$GITHUB_WORKSPACE/snes9x-ntsc-lie-pal-android-arm64.zip" .)
          gh release upload "$TAG" snes9x-ntsc-lie-pal-android-arm64.zip --clobber
